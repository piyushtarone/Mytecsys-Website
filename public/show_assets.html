  h1 { text-align: center; margin-bottom: 30px; font-size: 24px; font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }

  .img-container { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; background: #f8fafc; border-radius: 8px; overflow: hidden; border: 1px dashed #cbd5e1; }
  img { max-width: 100%; max-height: 100%; object-fit: contain; }
  h3 { margin: 12px 0 4px 0; font-size: 14px; word-break: break-all; text-align: center; }
  p { margin: 0; color: #64748b; font-size: 12px; font-weight: 600; }
</style>
</head>
